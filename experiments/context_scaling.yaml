experiment:
  name: context-v1
  dataset: benchmark_fixture
  split: test
  concurrency: 8
  max_examples: 10

decision_schema:
  version: "1.0"

# Context scaling experiment: minimal routing state vs rich routing state.
# Primary question: does additional context produce enough quality improvement
# to justify the additional routing token cost?
context:
  conditions:
    - id: minimal
      description: "Minimal routing state — structured metadata only"
      fields:
        - customer_tier
        - product
        - region
        - ticket_subject
      # Expected: lower input token count, potentially lower accuracy on edge cases

    - id: rich
      description: "Rich routing state — full application context"
      fields:
        - customer_tier
        - product
        - region
        - ticket_subject
        - ticket_body
        - draft_reply
      # Expected: higher input token count, potentially higher accuracy

routers:
  - rules
  - mock_jev
  # - llm_single
  # - llm_parallel
  # - jev

metrics:
  latency: true
  token_usage: true
  cost: true
  accuracy: true
  f1: true
  calibration: true

retry:
  max_attempts: 2
  backoff_ms: 250
